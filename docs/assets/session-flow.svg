<svg xmlns="http://www.w3.org/2000/svg" width="1090" height="170" viewBox="0 0 1090 170" role="img" aria-labelledby="sb-title sb-desc">
  <title id="sb-title">Menü çubuğunda bir Uykusuz oturumu</title>
  <desc id="sb-desc">Yan yana üç menü çubuğu görüntüsü. Süreyi girin: kapalı göze tıklayınca Gün, Saat ve Dakika yazan üç kutu açılır, Saat kutusu seçilidir. Geri sayımı izleyin: göz açılır, gözbebeği görünür ve yanında 3:59:41 gösteren canlı bir geri sayım ile küçük bir çarpı durur. Basılı tutup bitirin: çarpıyı basılı tutmak etrafında bir halka doldurur, geri sayım 3:59:40'ı gösterir.</desc>
  <style>
    svg { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif; }
    .bg { fill: #242628; }
    .cap { fill: #E6E3DD; }
    .bar { fill: #1E1F21; stroke: #FFFFFF; stroke-opacity: 0.08; stroke-width: 1.5; }
    .mark-line { fill: none; stroke: #FFFFFF; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .mark-fill { fill: #FFFFFF; }
    .pill { fill: #17191B; fill-opacity: 0.92; stroke: #FFFFFF; stroke-opacity: 0.10; stroke-width: 0.9; }
    .pill-ph { fill: #FFFFFF; fill-opacity: 0.42; }
    .focus { fill: none; stroke: #A6BBC3; stroke-width: 2.7; }
    .count { fill: #FFFFFF; }
    .track { fill: none; stroke: #FFFFFF; stroke-opacity: 0.14; stroke-width: 2.9; }
    .prog { fill: none; stroke: #A6BBC3; stroke-width: 2.9; stroke-linecap: round; }
    .x { fill: none; stroke: #FFFFFF; stroke-opacity: 0.85; stroke-width: 2.6; stroke-linecap: round; }
  </style>
  <defs>
    <!-- EyeMarkGeometry on its 24-unit grid, monochrome. Closed: the lid shades the whole lens, lashes below.
         Open: lid gone, pupil with its highlight bite showing, lashes above. Paths match docs/mockups/menubar-ux.html. -->
    <g id="sb-mark-closed">
      <path class="mark-fill" d="M1.5 12 C7 4.5 17 4.5 22.5 12 C17 19.5 7 19.5 1.5 12 Z"/>
      <path class="mark-line" d="M1.5 12 C7 4.5 17 4.5 22.5 12 C17 19.5 7 19.5 1.5 12 Z"/>
      <path class="mark-line" d="M4.5499 17.8023 L3.1442 20.1659 M8.2636 19.3782 L7.5468 22.0332 M12 19.875 L12 22.625 M15.7364 19.3782 L16.4532 22.0332 M19.4501 17.8023 L20.8558 20.1659"/>
    </g>
    <g id="sb-mark-open">
      <path class="mark-line" d="M1.5 12 C7 4.5 17 4.5 22.5 12 C17 19.5 7 19.5 1.5 12 Z"/>
      <path class="mark-fill" d="M15.3953 9.8853 A4 4 0 1 1 14.1147 8.6047 A1.4 1.4 0 1 0 15.3953 9.8853 Z"/>
      <path class="mark-line" d="M4.5499 6.1977 L3.1442 3.8341 M8.2636 4.6218 L7.5468 1.9668 M12 4.125 L12 1.375 M15.7364 4.6218 L16.4532 1.9668 M19.4501 6.1977 L20.8558 3.8341"/>
    </g>
  </defs>

  <rect class="bg" x="0" y="0" width="1090" height="170" rx="24"/>

  <!-- Single row. Every strip is the menu bar excerpt at native proportions, enlarged 1.25x.
       Outer padding 28, gap between groups 32. Strips share the top edge y=72 and bottom edge y=142;
       captions share the baseline y=50 and are centred over their own strip.
       Each pill is as wide as its Turkish placeholder plus the pill's padding, as PillView lays it out. -->

  <!-- 1. Süreyi girin: bar 356 x 56 native, 445 x 70 drawn, x 28..473 -->
  <text class="cap" x="250.5" y="50" font-size="24" font-weight="600" text-anchor="middle">Süreyi girin</text>
  <g transform="translate(28 72) scale(1.25)">
    <rect class="bar" x="0" y="0" width="356" height="56" rx="12"/>
    <g transform="translate(14 12.7) scale(1.275)">
      <use href="#sb-mark-closed"/>
    </g>
    <rect class="pill" x="62" y="11" width="74" height="34" rx="12.6"/>
    <text class="pill-ph" x="99" y="36" font-size="22" text-anchor="middle">Gün</text>
    <rect class="pill" x="148" y="11" width="80" height="34" rx="12.6"/>
    <rect class="focus" x="149.4" y="12.4" width="77.2" height="31.2" rx="11.2"/>
    <text class="pill-ph" x="188" y="36" font-size="22" text-anchor="middle">Saat</text>
    <rect class="pill" x="240" y="11" width="102" height="34" rx="12.6"/>
    <text class="pill-ph" x="291" y="36" font-size="22" text-anchor="middle">Dakika</text>
  </g>

  <!-- 2. Geri sayımı izleyin: bar 210 x 56 native, 262.5 x 70 drawn, x 505..767.5 -->
  <text class="cap" x="636.25" y="50" font-size="24" font-weight="600" text-anchor="middle">Geri sayımı izleyin</text>
  <g transform="translate(505 72) scale(1.25)">
    <rect class="bar" x="0" y="0" width="210" height="56" rx="12"/>
    <g transform="translate(14 12.7) scale(1.275)">
      <use href="#sb-mark-open"/>
    </g>
    <text class="count" x="62" y="36" font-size="24" font-weight="500">3:59:41</text>
    <g transform="translate(174 28)">
      <circle class="track" cx="0" cy="0" r="14.5"/>
      <path class="x" d="M-4.5 -4.5 L4.5 4.5 M4.5 -4.5 L-4.5 4.5"/>
    </g>
  </g>

  <!-- 3. Basılı tutup bitirin: same strip, x held with the ring about 60% filled clockwise from the top, x 799.5..1062 -->
  <text class="cap" x="930.75" y="50" font-size="24" font-weight="600" text-anchor="middle">Basılı tutup bitirin</text>
  <g transform="translate(799.5 72) scale(1.25)">
    <rect class="bar" x="0" y="0" width="210" height="56" rx="12"/>
    <g transform="translate(14 12.7) scale(1.275)">
      <use href="#sb-mark-open"/>
    </g>
    <text class="count" x="62" y="36" font-size="24" font-weight="500">3:59:40</text>
    <g transform="translate(174 28) scale(1.12)">
      <circle class="track" cx="0" cy="0" r="14.5"/>
      <path class="prog" d="M0 -14.5 A14.5 14.5 0 1 1 -8.52 11.73"/>
      <path class="x" d="M-4.5 -4.5 L4.5 4.5 M4.5 -4.5 L-4.5 4.5"/>
    </g>
  </g>
</svg>
