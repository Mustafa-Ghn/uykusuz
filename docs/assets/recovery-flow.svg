<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="476" viewBox="0 0 1100 476" role="img" aria-labelledby="rf-title rf-desc">
  <title id="rf-title">Uykusuz kurtarma akışı</title>
  <desc id="rf-desc">Birleşen iki yolun sadeleştirilmiş çizimi. Uygulama temizliği, oturum bitince ya da uygulama yeniden açılınca çalışır. Ayrı bir yedek denetim 60 saniyede bir launchd ile çalışır ve geçerli, süresi dolmamış bir oturuma dokunmaz. İki yol tek bir adımda birleşir: doğrulanan değişiklikleri geri almayı dener. Yalnızca doğrulanabilen değişiklikler geri alınır; başarısız ya da okunamayan kanıt temiz sayılmaz, saklanır. Altında bir uyarı: ilgilenmeniz gerekebilir. İki durum bunu gerektirir: kaydedilmiş ses yalnızca Uykusuz yeniden açılınca geri yüklenir, doğrulanamayan donmuş bir süreci ise kendiniz denetlemelisiniz. Yedek denetim yalnızca kaydedilmiş değişiklikleri geri alır; pili ya da ısıyı izlemez ve sesi geri yükleyemez. Solda, temizlik beklerken sağ tık menüsünün örnek bir çizimi: Oturum yokken uyku hâlâ engelleniyor uyarısı, bir durum satırı, ardından Ayarlar ve Uykusuz'dan Çık. Bir ekran görüntüsü değil, çizimdir.</desc>
  <style>
    svg { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif; }
    .bg { fill: #F3F2EF; }
    .panel { fill: #FAF9F6; stroke: #DBD9D4; stroke-width: 1.5; }
    .menu { fill: #F7F6F3; stroke: #CFCDC8; stroke-width: 1.5; }
    .sep { stroke: #DBD9D4; stroke-width: 1.5; }
    .t { fill: #292D30; }
    .m { fill: #5F6467; }
    .a { fill: #536D78; }
    .ln { fill: none; stroke: #536D78; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .ic { fill: none; stroke: #292D30; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .mark-line { fill: none; stroke: #292D30; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .mark-fill { fill: #292D30; }
    .warn { fill: #A85A00; }
    .warn-ic { fill: none; stroke: #A85A00; stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #242628; }
      .panel { fill: #303336; stroke: #3E4145; }
      .menu { fill: #383B3F; stroke: #4A4D51; }
      .sep { stroke: #4A4D51; }
      .t { fill: #E6E3DD; }
      .m { fill: #B5B7B8; }
      .a { fill: #A6BBC3; }
      .ln { stroke: #A6BBC3; }
      .ic { stroke: #E6E3DD; }
      .mark-line { stroke: #E6E3DD; }
      .mark-fill { fill: #E6E3DD; }
      .warn { fill: #F2A854; }
      .warn-ic { stroke: #F2A854; }
    }
  </style>
  <defs>
    <!-- EyeMarkGeometry on its 24-unit grid, monochrome. Closed: the lid shades the whole lens, lashes below.
         Paths match docs/mockups/menubar-ux.html. -->
    <g id="rf-mark-closed">
      <path class="mark-fill" d="M1.5 12 C7 4.5 17 4.5 22.5 12 C17 19.5 7 19.5 1.5 12 Z"/>
      <path class="mark-line" d="M1.5 12 C7 4.5 17 4.5 22.5 12 C17 19.5 7 19.5 1.5 12 Z"/>
      <path class="mark-line" d="M4.5499 17.8023 L3.1442 20.1659 M8.2636 19.3782 L7.5468 22.0332 M12 19.875 L12 22.625 M15.7364 19.3782 L16.4532 22.0332 M19.4501 17.8023 L20.8558 20.1659"/>
    </g>
    <marker id="rf-arrow" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="11" refY="7" markerUnits="userSpaceOnUse" orient="auto">
      <path class="a" d="M2 2 L12 7 L2 12 Z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1100" height="476" rx="24"/>

  <!-- Header -->
  <g transform="translate(32 20) scale(1.6667)">
    <use href="#rf-mark-closed"/>
  </g>
  <text class="t" x="88" y="50" font-size="26" font-weight="700">Normale dönmenin iki yolu</text>

  <!-- Example right-click menu while cleanup is pending (illustration). The lines are StatusMenu's own:
       SleepHeldLine for no session with sleep still held, StatusLines.machine, then Settings and Quit. -->
  <g>
    <rect class="menu" x="32" y="112" width="400" height="168" rx="12"/>
    <text class="warn" x="52" y="146" font-size="19">Oturum yokken uyku hâlâ engelleniyor</text>
    <text class="m" x="52" y="176" font-size="19">Kapak: açık · %87</text>
    <path class="sep" d="M44 192 H420"/>
    <text class="t" x="52" y="224" font-size="19">Ayarlar…</text>
    <text class="m" x="412" y="224" font-size="19" text-anchor="end">⌘,</text>
    <text class="t" x="52" y="258" font-size="19">Uykusuz'dan Çık</text>
    <text class="m" x="412" y="258" font-size="19" text-anchor="end">⌘Q</text>
  </g>
  <text class="m" x="32" y="310" font-size="17">Temizlik beklerken menü. Çizimdir.</text>

  <!-- Node: app cleanup -->
  <g>
    <rect class="panel" x="472" y="80" width="290" height="120" rx="16"/>
    <g transform="translate(492 96) scale(1.3333)">
      <use href="#rf-mark-closed"/>
    </g>
    <text class="t" x="536" y="122" font-size="22" font-weight="700">Uygulama temizliği</text>
    <text class="m" x="492" y="170" font-size="18">Oturum bitince ya da açılışta</text>
  </g>

  <!-- Node: backup check -->
  <g>
    <rect class="panel" x="778" y="80" width="290" height="120" rx="16"/>
    <g class="ic" transform="translate(798 98)">
      <circle cx="16" cy="16" r="13"/>
      <path d="M16 8 V16 H22"/>
    </g>
    <text class="t" x="842" y="122" font-size="22" font-weight="700">Yedek denetim</text>
    <text class="m" x="798" y="170" font-size="18">60 saniyede bir (launchd)</text>
  </g>

  <!-- Converge -->
  <path class="ln" d="M617 200 V224 H923 V200"/>
  <path class="ln" d="M770 224 V244" marker-end="url(#rf-arrow)"/>

  <!-- Restore -->
  <g>
    <rect class="panel" x="472" y="248" width="596" height="76" rx="16"/>
    <text class="t" x="770" y="294" font-size="22" font-weight="700" text-anchor="middle">Doğrulanan değişiklikleri geri almayı dener</text>
  </g>

  <!-- Warning, and the two cases that need you -->
  <path class="ln" d="M770 324 V350" marker-end="url(#rf-arrow)"/>
  <g class="warn-ic">
    <path d="M646 362 L658 384 H634 Z"/>
    <path d="M646 370 V377"/>
    <path d="M646 380.5 V381"/>
  </g>
  <text class="warn" x="669" y="382" font-size="22" font-weight="700">İlgilenmeniz gerekebilir</text>
  <text class="m" x="770" y="418" font-size="18" text-anchor="middle">Kaydedilmiş ses için Uykusuz'u açın</text>
  <text class="m" x="770" y="446" font-size="18" text-anchor="middle">Doğrulanamayan donmuş süreci denetleyin</text>
</svg>
